services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
  engine:
    build: ./engine
    env_file: .env
    restart: unless-stopped
    volumes: ["vision:/private/vision"]
  worker:
    build: ./engine
    command: ["python", "worker.py"]
    env_file: .env
    restart: unless-stopped
volumes:
  vision:
